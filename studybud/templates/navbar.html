{% load static %}

<header class="header">
  <div class="container header__inner">
    <a href="{% url 'home' %}" class="header__logo">
      <div class="header__logo-icon">S</div>
      <span class="header__logo-text">StudyBud<span class="header__logo-dot"></span></span>
    </a>

    <form class="header__search" method="GET" action="{% url 'home' %}">
      <label>
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input name="q" placeholder="Search for rooms..." value="{{ request.GET.q }}" />
      </label>
    </form>

    <nav class="header__nav">
      {% if request.user.is_authenticated %}
      <div class="dropdown">
        <div class="header__user" id="userDropdownToggle">
          <div class="avatar avatar--xs">
            {% if request.user.profile.avatar %}
            <img src="{{ request.user.profile.avatar.url }}" alt="{{request.user.username}}" />
            {% else %}
            <span class="avatar__initials">{{ request.user.username|first|upper }}</span>
            {% endif %}
          </div>
          <div class="header__user-name">
            {{request.user.username}}
            <small>@{{request.user.username}}</small>
          </div>
          <button type="button" class="header__dropdown-btn" aria-label="Menu">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
            </svg>
          </button>
        </div>

        <div class="dropdown-menu" id="userDropdown">
          <a href="{% url 'update-user' %}" class="dropdown-menu__item">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            Settings
          </a>
          <a href="{% url 'logout' %}" class="dropdown-menu__item">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
            </svg>
            Logout
          </a>
        </div>
      </div>
      {% else %}
      <a href="{% url 'login' %}" class="header__login-link">
        Sign In
      </a>
      {% endif %}

      <button type="button" class="mobile-search-toggle" aria-label="Toggle search">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
      </button>
    </nav>
  </div>
</header>
