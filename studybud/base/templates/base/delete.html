{% extends 'main.html' %}

{% block content %}
<div class="container grid-center">
  <div class="card delete" style="width: 100%;">
    <div class="card__body" style="padding: 4rem 2rem;">
      <form class="form" method="POST" action="">
        {% csrf_token %}
        <svg class="delete__icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>
        <h2 class="delete__title">Are you sure?</h2>
        <p class="delete__message">This action cannot be undone.</p>
        {% if obj.room %}
        <span class="delete__badge">Message</span>
        {% else %}
        <span class="delete__badge">Room</span>
        {% endif %}
        <p class="delete__name">"{{obj}}"</p>

        <div class="form__actions" style="justify-content: center;">
          <a class="btn btn--secondary" href="{{request.META.HTTP_REFERER}}">Cancel</a>
          <button class="btn btn--danger" type="submit">Delete</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock content %}
