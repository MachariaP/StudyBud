{% extends 'main.html' %}

{% block content %}
<div class="container grid-center">
  <div class="card" style="max-width: 64rem; width: 100%;">
    <div class="card__header">
      <a href="{% url 'home' %}" class="btn btn--ghost btn--sm">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
      </a>
      <h3 style="font-size: 1.6rem; font-weight: 700; color: var(--text);">Browse Topics</h3>
    </div>

    <div class="card__body">
      <form action="{% url 'topics' %}" method="GET" style="margin-bottom: 2rem;">
        <div class="header__search" style="max-width: 100%;">
          <label>
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input name="q" placeholder="Search topics..." value="{{ request.GET.q }}" />
          </label>
        </div>
      </form>

      <p style="color: var(--text-muted); margin-bottom: 1.5rem; font-size: 1.3rem;">{{topics.count}} topic{{topics.count|pluralize}}</p>

      <a href="{% url 'home' %}" class="topic-card">
        <span class="topic-card__name">All Topics</span>
        <span class="topic-card__count">{{topics.count}}</span>
      </a>

      {% for topic in topics %}
      <a href="{% url 'home' %}?q={{topic.name}}" class="topic-card">
        <span class="topic-card__name">{{topic.name}}</span>
        <span class="topic-card__count">{{topic.room_set.all.count}} room{{topic.room_set.all.count|pluralize}}</span>
      </a>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
