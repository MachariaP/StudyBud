{% extends 'main.html' %}

{% block content %}
<main class="auth-page">
  <div class="glass forgot-card animate-fade-in-up">
    <div class="forgot-card__header">
      <h1 class="forgot-card__title">Reset Password</h1>
      <p class="forgot-card__desc">Enter your email address and we'll send you a link to reset your password.</p>
    </div>

    <form class="forgot-form" action="" method="POST">
      {% csrf_token %}

      <div class="form__group">
        <label for="email">Email Address</label>
        <div class="input-icon-wrap">
          <span class="material-symbols-outlined input-icon">mail</span>
          <input id="email" name="email" type="email" placeholder="name@example.com" required />
        </div>
      </div>

      <button type="submit" class="btn btn--auth forgot-submit">
        Send Reset Link
      </button>
    </form>

    <div class="forgot-card__footer">
      <a href="{% url 'login' %}" class="forgot-back">
        <span class="material-symbols-outlined">arrow_back</span>
        Back to Login
      </a>
    </div>
  </div>
</main>
{% endblock content %}
