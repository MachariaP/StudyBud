{% extends 'main.html' %}

{% block content %}
<main class="auth-page">
  <div class="glass forgot-card animate-fade-in-up">
    <div class="forgot-card__header">
      <h1 class="forgot-card__title">Set New Password</h1>
      <p class="forgot-card__desc">Enter your new password below.</p>
    </div>

    <form class="forgot-form" action="" method="POST">
      {% csrf_token %}

      <div class="form__group">
        <label for="password1">New Password</label>
        <div class="input-icon-wrap">
          <span class="material-symbols-outlined input-icon">lock</span>
          <input id="password1" name="password1" type="password" placeholder="Min. 8 characters" required minlength="8" />
        </div>
      </div>

      <div class="form__group">
        <label for="password2">Confirm Password</label>
        <div class="input-icon-wrap">
          <span class="material-symbols-outlined input-icon">verified_user</span>
          <input id="password2" name="password2" type="password" placeholder="Re-enter password" required minlength="8" />
        </div>
      </div>

      <button type="submit" class="btn btn--auth forgot-submit">
        Reset Password
      </button>
    </form>
  </div>
</main>
{% endblock content %}
