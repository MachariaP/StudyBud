{% extends 'main.html' %}

{% block content %}
<div class="container grid-center">
  <div class="card" style="max-width: 56rem; width: 100%;">
    <div class="card__header">
      <a href="{% url 'home' %}" class="btn btn--ghost btn--sm">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
      </a>
      <h3 style="font-size: 1.6rem; font-weight: 700; color: var(--text);">
        {% if room %}Update{% else %}Create{% endif %} Study Room
      </h3>
    </div>

    <div class="card__body">
      <form class="form" action="" method="POST">
        {% csrf_token %}

        <div class="form__group">
          <label for="room_topic">Topic</label>
          <input required type="text" value="{{room.topic.name}}" name="topic" list="topic-list" id="topic-input" />
          <datalist id="topic-list">
            <select id="room_topic">
              {% for topic in topics %}
              <option value="{{topic.name}}">{{topic.name}}</option>
              {% endfor %}
            </select>
          </datalist>
          <div class="topic-chips">
            {% for topic in topics|slice:":8" %}
            <span class="topic-chip" data-value="{{topic.name}}">{{topic.name}}</span>
            {% endfor %}
          </div>
        </div>

        <div class="form__group">
          <label for="room_name">Room Name</label>
          {{form.name}}
        </div>

        <div class="form__group">
          <label for="room_description">Description</label>
          {{form.description}}
        </div>

        <div class="form__actions">
          <a class="btn btn--secondary" href="{% url 'home' %}">Cancel</a>
          <button class="btn btn--primary" type="submit">
            {% if room %}Update{% else %}Create{% endif %} Room
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock content %}
